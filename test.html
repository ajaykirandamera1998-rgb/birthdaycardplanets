<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Green Screen Video Texture Test</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>
  <style>
    #status {
      position: fixed; top: 8px; left: 8px; z-index: 10;
      background: rgba(0,0,0,.7); color: #fff; font: 13px/1.4 monospace;
      padding: 8px 10px; border-radius: 6px; max-width: 90vw; white-space: pre-line;
    }
  </style>
</head>
<body style="margin: 0; background: #ffeb3b;">

  <div id="status">Loading...</div>

  <a-scene background="color: #ffeb3b" renderer="colorManagement: true">

    <a-assets timeout="30000">
      <a-asset-item id="birthdayModel" src="BD.glb"></a-asset-item>

      <!-- Each video has its own id -->
      <video id="vid1" src="video.webm" autoplay loop muted playsinline crossorigin="anonymous" preload="auto"></video>
      <video id="vid2" src="video-1.webm" autoplay loop muted playsinline crossorigin="anonymous" preload="auto"></video>
    </a-assets>

    <a-entity camera position="0 1.2 3.5" look-controls wasd-controls></a-entity>

    <a-light type="ambient" color="#FFF" intensity="1"></a-light>
    <a-light type="directional" position="2 4 2" intensity="1.2"></a-light>

    <!-- The cake. fit-model scales it to 1.6 units tall and sits it on the floor.
         video-planes finds the Blender planes by name and plays the videos on them:
         flame1 -> #vid1 (plays from the start).
         flame2 -> #vid2 (starts a bit later, see FLAME2_OFFSET_SECONDS). -->
    <a-entity id="model"
              gltf-model="#birthdayModel"
              fit-model="height: 1.6"
              video-planes="flame1: #vid1; flame2: #vid2"
              animation-mixer></a-entity>

    <a-plane rotation="-90 0 0" width="12" height="12" color="#fdd835"></a-plane>
  </a-scene>

  <script>
    const status = document.getElementById('status');
    const log = (msg) => { status.textContent += '\n' + msg; console.log(msg); };
    status.textContent = 'Page loaded. Waiting for assets...';

    // Scales a loaded glTF to a target height and sits it on y = 0, centered on x/z.
    AFRAME.registerComponent('fit-model', {
      schema: { height: { default: 1.6 } },
      init() {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          obj.updateMatrixWorld(true);
          const size = new THREE.Box3().setFromObject(obj).getSize(new THREE.Vector3());
          const s = this.data.height / (size.y || 1);
          this.el.object3D.scale.setScalar(s);
          this.el.object3D.updateMatrixWorld(true);
          const box = new THREE.Box3().setFromObject(obj);
          const c = box.getCenter(new THREE.Vector3());
          this.el.object3D.position.x -= c.x;
          this.el.object3D.position.z -= c.z;
          this.el.object3D.position.y -= box.min.y;
          log('Model OK. Original height ' + size.y.toFixed(2) + ', scaled x' + s.toFixed(3));
        });
        this.el.addEventListener('model-error', () => {
          log('MODEL FAILED to load BD.glb - is it in the same folder as test.html?');
        });
      }
    });

    // Replaces the material of named meshes in the model with a live, transparent video.
    // Schema is open-ended: each property is  meshName: #videoId
    AFRAME.registerComponent('video-planes', {
      schema: { default: {}, parse: (v) => v, stringify: (v) => v },
      init() {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          const wanted = this.parsePairs();
          const meshNames = [];
          const done = {};
          const textures = {};

          root.traverse((o) => {
            if (!o.isMesh) return;
            meshNames.push(o.name || '(unnamed)');
            Object.keys(wanted).forEach((name) => {
              if (done[name] || !o.name || !o.name.startsWith(name)) return;
              const video = document.querySelector(wanted[name]);
              if (!video) { log(name + ': video ' + wanted[name] + ' not found'); return; }

              // Planes that use the same video share one texture, so they always stay in sync.
              let tex = textures[wanted[name]];
              if (!tex) {
                tex = new THREE.VideoTexture(video);
                tex.colorSpace = THREE.SRGBColorSpace;
                // glTF UVs are top-left based, so the texture must NOT be flipped
                tex.flipY = false;
                textures[wanted[name]] = tex;
              }

              o.material = new THREE.MeshBasicMaterial({
                map: tex,
                transparent: true,
                alphaTest: 0.01,
                side: THREE.DoubleSide,
                depthWrite: false,
                toneMapped: false
              });
              o.renderOrder = 10; // draw after the cake so transparency blends correctly
              done[name] = true;
              log(name + ' -> ' + wanted[name] + ' OK');
            });
          });

          Object.keys(wanted).forEach((name) => {
            if (!done[name]) log(name + ' NOT FOUND. Meshes in BD.glb: ' + meshNames.join(', '));
          });
        });
      },
      parsePairs() {
        // Reads the raw attribute text "flame1: #vid1; flame2: #vid2"
        const raw = this.el.getAttribute('video-planes');
        const out = {};
        if (typeof raw === 'string') {
          raw.split(';').forEach((part) => {
            const [k, v] = part.split(':').map((s) => s.trim());
            if (k && v) out[k] = v;
          });
        } else if (raw && typeof raw === 'object') {
          Object.assign(out, raw);
        }
        return out;
      }
    });

    document.querySelector('a-assets').addEventListener('timeout', () => {
      log('Asset load TIMED OUT - check the file names and the Network tab (F12).');
    });

    // ---- Time difference between the two flames ----------------------------------
    // How far AHEAD flame2 runs compared with flame1.
    // Seconds = frames / fps. Example: 12 frames at 24 fps = 0.5. Set 0 for no difference.
    const FLAME2_OFFSET_SECONDS = 0.5;

    const v1 = document.getElementById('vid1');
    const v2 = document.getElementById('vid2');

    function syncAndPlay() {
      const d = v2.duration;
      v1.currentTime = 0;
      v2.currentTime = (isFinite(d) && d > 0) ? FLAME2_OFFSET_SECONDS % d : FLAME2_OFFSET_SECONDS;
      v1.play().catch(() => {});
      v2.play().catch(() => {});
    }

    let started = false;
    function startWhenReady() {
      if (started || v1.readyState < 2 || v2.readyState < 2) return;
      started = true;
      syncAndPlay();
      log('flame2 starts ' + FLAME2_OFFSET_SECONDS + 's ahead of flame1');
    }

    [['vid1', v1], ['vid2', v2]].forEach(([id, v]) => {
      v.addEventListener('error', () => log(id + ' FAILED to load (' + v.getAttribute('src') + ')'));
      v.addEventListener('loadeddata', () => { log(id + ' loaded'); startWhenReady(); });
    });
    startWhenReady();

    // Browsers sometimes block autoplay; first click/tap restarts both with the offset.
    document.body.addEventListener('click', syncAndPlay, { once: true });
  </script>
</body>
</html>
