<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Birthday Card</title>

  <!-- Order matters: A-Frame first, then MindAR, then aframe-extras (for animation-mixer) -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.2.0/dist/aframe-extras.min.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* Only used when the page is opened with ?debug (see the script below). */
    #status {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font: 13px/1.4 monospace;
      padding: 8px 10px;
      border-radius: 6px;
      max-width: 90vw;
      white-space: pre-line;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!--
    imageTargetSrc is the compiled target file made from your card image (targets.mind),
    in the same folder as this page.

    MindAR's own screens (a loading spinner at the start and a scanning frame while it looks
    for the card) are left on, so people know what to do. To hide them as well, add
    "uiLoading: no; uiScanning: no;" inside the mindar-image attribute below.
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets timeout="120000">
      <a-asset-item id="birthdayModel" src="BD.glb"></a-asset-item>

      <!-- Each video has its own id -->
      <video
        id="vid1"
        src="video.webm"
        autoplay
        loop
        muted
        playsinline
        crossorigin="anonymous"
        preload="auto">
      </video>

      <video
        id="vid2"
        src="video-1.webm"
        autoplay
        loop
        muted
        playsinline
        crossorigin="anonymous"
        preload="auto">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-light type="ambient" color="#FFF" intensity="1"></a-light>
    <a-light type="directional" position="2 4 2" intensity="1.2"></a-light>

    <!--
      Everything inside this entity is attached to the card.

      The card lies in the X/Y plane and "out of the card" is +Z. 1 unit = the card's width.

      card-layout decides how the cake stands on it (see DEFAULT_LAYOUT in the script):
        - upright: the card stands up (on a screen, a wall, or held in your hand).
                   The cake's up is the card's up.
        - flat:    the card lies flat on a table. The cake stands up out of the card.

      fit-model sizes the cake so that its footprint is SIZE times the card's width and
      centres it on the card.

      video-planes puts the live flame videos on the Blender planes: flame1 -> #vid1, flame2 -> #vid2.
    -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity card-layout>
        <a-entity
          id="model"
          gltf-model="#birthdayModel"
          fit-model
          video-planes="flame1: #vid1; flame2: #vid2"
          animation-mixer>
        </a-entity>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    // ---------------------------------------------------------------
    // Settings you can change
    // ---------------------------------------------------------------
    // 'upright' = card standing up (screen, wall, held in hand)
    // 'flat'    = card lying flat on a table
    const DEFAULT_LAYOUT = 'upright';

    // Cake width as a fraction of the card width. 1 = same width as the card.
    const DEFAULT_SIZE = 1;

    // How far ahead flame2 runs compared with flame1.
    // Seconds = frames / fps. Example: 12 frames at 24 fps = 0.5 seconds. Use 0 for none.
    const FLAME2_OFFSET_SECONDS = 0.5;

    // ---------------------------------------------------------------
    // Quick testing without editing the file (add to the page address):
    //   ?view=flat        card lying flat on a table
    //   ?view=upright     card standing up
    //   ?size=1.5         cake 1.5 times the card width
    //   ?debug            shows a small box with what loaded (for finding problems)
    // Combine with &, for example:  ...?view=flat&size=1.2
    // ---------------------------------------------------------------
    const params = new URLSearchParams(window.location.search);

    const CONFIG = {
      layout:
        params.get('view') === 'flat' ? 'flat' :
        params.get('view') === 'upright' ? 'upright' :
        DEFAULT_LAYOUT,
      size: parseFloat(params.get('size')) || DEFAULT_SIZE
    };

    // The on-screen message box only exists in debug mode, so the normal screen stays clean.
    const DEBUG = params.has('debug');
    const lines = [];
    let status = null;

    if (DEBUG) {
      status = document.createElement('div');
      status.id = 'status';
      document.body.appendChild(status);
    }

    // Keeps only the last 8 messages. Everything is also written to the browser console.
    const log = (msg) => {
      console.log(msg);

      if (!status) return;

      lines.push(msg);

      if (lines.length > 8) {
        lines.shift();
      }

      status.textContent = lines.join('\n');
    };

    log('Layout: ' + CONFIG.layout + ', size: ' + CONFIG.size);

    // Stands the cake on the card according to the chosen layout.
    AFRAME.registerComponent('card-layout', {
      init() {
        this.el.setAttribute('rotation', {
          x: CONFIG.layout === 'flat' ? 90 : 0,
          y: 0,
          z: 0
        });
      }
    });

    // Scales a loaded glTF model so its footprint is CONFIG.size card-widths wide, and centres
    // it on the card. In the 'flat' layout its base sits on the card; in 'upright' it is
    // centred on the card.
    AFRAME.registerComponent('fit-model', {
      init() {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.object3D;
          const obj = this.el.getObject3D('mesh');

          if (!obj) {
            log('Model loaded, but its 3D mesh could not be found.');
            return;
          }

          // Build each mesh's matrix relative to the model entity using only
          // local transforms. World matrices can be invalid while MindAR keeps
          // the card anchor hidden before the card is detected.
          const relative = (object) => {
            const matrix = new THREE.Matrix4();

            for (
              let current = object;
              current && current !== root;
              current = current.parent
            ) {
              current.updateMatrix();
              matrix.premultiply(current.matrix);
            }

            return matrix;
          };

          const box = new THREE.Box3();

          obj.traverse((object) => {
            if (!object.isMesh || !object.geometry) return;

            if (!object.geometry.boundingBox) {
              object.geometry.computeBoundingBox();
            }

            box.union(
              object.geometry.boundingBox.clone().applyMatrix4(relative(object))
            );
          });

          const size = box.getSize(new THREE.Vector3());
          const center = box.getCenter(new THREE.Vector3());

          if (box.isEmpty() || !isFinite(size.x + size.y + size.z)) {
            log('Could not measure the model. Keeping original size and position.');
            return;
          }

          const scale = CONFIG.size / (Math.max(size.x, size.z) || 1);

          root.scale.setScalar(scale);
          root.position.set(
            -center.x * scale,
            (CONFIG.layout === 'flat' ? -box.min.y : -center.y) * scale,
            -center.z * scale
          );

          log(
            'Model OK. Size ' +
              size.x.toFixed(2) + ' x ' +
              size.y.toFixed(2) + ' x ' +
              size.z.toFixed(2) +
              ', scaled x' + scale.toFixed(3)
          );
        });

        this.el.addEventListener('model-error', () => {
          log('MODEL FAILED to load BD.glb. Is it in the same folder as index.html?');
        });
      }
    });

    // Replaces the material of named meshes in the model with live,
    // transparent video textures.
    // Example: flame1: #vid1
    AFRAME.registerComponent('video-planes', {
      schema: {
        default: {},
        parse: (value) => value,
        stringify: (value) => value
      },

      init() {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          const wanted = this.parsePairs();
          const meshNames = [];
          const done = {};
          const textures = {};

          if (!root) {
            log('Cannot apply video planes: model mesh not found.');
            return;
          }

          root.traverse((object) => {
            if (!object.isMesh) return;

            meshNames.push(object.name || '(unnamed)');

            Object.keys(wanted).forEach((name) => {
              if (done[name] || !object.name || !object.name.startsWith(name)) {
                return;
              }

              const video = document.querySelector(wanted[name]);

              if (!video) {
                log(name + ': video ' + wanted[name] + ' not found');
                return;
              }

              // Planes using the same video share one texture, so they stay synchronized.
              let texture = textures[wanted[name]];

              if (!texture) {
                texture = new THREE.VideoTexture(video);
                texture.colorSpace = THREE.SRGBColorSpace;

                // glTF UVs are top-left based, so do not flip the texture.
                texture.flipY = false;

                textures[wanted[name]] = texture;
              }

              object.material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                alphaTest: 0.01,
                side: THREE.DoubleSide,
                depthWrite: false,
                toneMapped: false
              });

              object.renderOrder = 10;
              done[name] = true;

              log(name + ' -> ' + wanted[name] + ' OK');
            });
          });

          Object.keys(wanted).forEach((name) => {
            if (!done[name]) {
              log(
                name + ' NOT FOUND. Meshes in BD.glb: ' +
                meshNames.join(', ')
              );
            }
          });
        });
      },

      parsePairs() {
        // Reads the raw attribute text:
        // "flame1: #vid1; flame2: #vid2"
        const raw = this.el.getAttribute('video-planes');
        const output = {};

        if (typeof raw === 'string') {
          raw.split(';').forEach((part) => {
            const [key, value] = part.split(':').map((item) => item.trim());

            if (key && value) {
              output[key] = value;
            }
          });
        } else if (raw && typeof raw === 'object') {
          Object.assign(output, raw);
        }

        return output;
      }
    });

    document
      .querySelector('a-assets')
      .addEventListener('timeout', () => {
        log(
          'Asset load TIMED OUT. Check BD.glb, video.webm, video-1.webm, and the Network tab (F12).'
        );
      });

    // ---------------------------------------------------------------
    // Time difference between the two flames
    // ---------------------------------------------------------------
    const video1 = document.getElementById('vid1');
    const video2 = document.getElementById('vid2');

    function syncAndPlay() {
      const duration = video2.duration;

      video1.currentTime = 0;

      video2.currentTime =
        isFinite(duration) && duration > 0
          ? FLAME2_OFFSET_SECONDS % duration
          : FLAME2_OFFSET_SECONDS;

      video1.play().catch(() => {});
      video2.play().catch(() => {});
    }

    let started = false;

    function startWhenReady() {
      if (started) return;
      if (video1.readyState < 2 || video2.readyState < 2) return;

      started = true;
      syncAndPlay();

      log('flame2 starts ' + FLAME2_OFFSET_SECONDS + 's ahead of flame1');
    }

    [
      ['vid1', video1],
      ['vid2', video2]
    ].forEach(([id, video]) => {
      video.addEventListener('error', () => {
        log(id + ' FAILED to load (' + video.getAttribute('src') + ')');
      });

      video.addEventListener('loadeddata', () => {
        log(id + ' loaded');
        startWhenReady();
      });
    });

    startWhenReady();

    // Browsers sometimes block autoplay. A first click or tap restarts both
    // videos with the intended offset.
    document.body.addEventListener('click', syncAndPlay, { once: true });

    // ---------------------------------------------------------------
    // Card tracking events
    // ---------------------------------------------------------------
    document.addEventListener('DOMContentLoaded', () => {
      const target = document.querySelector('[mindar-image-target]');

      if (!target) {
        log('MindAR target entity not found.');
        return;
      }

      target.addEventListener('targetFound', () => {
        log('Card found');
        syncAndPlay();
      });

      target.addEventListener('targetLost', () => {
        log('Card lost - keep it in view');
      });
    });
  </script>
</body>
</html>
